name: Build ESP-IDF Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          command: idf.py build

      - name: Create Merged Binary
        run: |
          # البحث عن ملف التطبيق الرئيسي ودمجه
          cd build
          # استخدام الأمر find للعثور على الملف الذي يحتوي على اسم المشروع
          APP_BIN=$(find . -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" | head -n 1)
          echo "Found app binary: $APP_BIN"
          
          # دمج الملفات
          esptool.py --chip esp32s3 merge_bin -o merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 $APP_BIN

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build/merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
