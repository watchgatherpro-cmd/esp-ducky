name: Build ESP-IDF Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          command: idf.py build

      - name: Install esptool
        run: pip install esptool

      - name: Create Merged Binary
        run: |
          # الانتقال إلى مجلد build للبحث عن الملفات
          cd build
          APP_BIN=$(find . -maxdepth 1 -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" | head -n 1)
          echo "Found app binary: $APP_BIN"
          
          # العودة إلى المجلد الرئيسي لإنشاء الملف هناك
          cd ..
          
          # تنفيذ أمر الدمج (مع تحديث الأسماء لتجنب التحذيرات)
          esptool --chip esp32s3 merge-bin -o merged.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/$APP_BIN

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
